  <!-- Hybrid Slider Script: Inline generation + Preload detection -->
  <script>
    // DEBUG flag - set to false in production to reduce console logs
    const DEBUG = false;

    // Helper functions - defined globally so they can be reused
    function generateListItems(projects) {
      const listContainer = document.querySelector('.list--home');
      if (!listContainer) return;

      // Generate cursor player wrapper with videos
      let cursorPlayerHTML = `
          <div class="cursor-player-animated js-cursor-player-animated">
            <div class="mooving-elements players-wrapper is-player" data-friction="7">
        `;

      projects.forEach(project => {
        cursorPlayerHTML += `
              <video
                class="js-video player-animated-player"
                data-src="${project.video_url}"
                playsinline
                loop
                muted
              ></video>
          `;
      });

      cursorPlayerHTML += `
            </div>
          </div>
        `;

      // Generate list items
      let listItemsHTML = '';
      projects.forEach((project, index) => {
        const link = project.link || `works/project-detail#id=${project.id}`;
        const displayClient = project.client_short || project.client;

        listItemsHTML += `
            <li class="${index === 0 ? 'is-active' : ''}" data-project-index="${index}">
              <a href="${link}" class="js-change-video">
              
                <p>${displayClient}</p>
                  <h2>${project.title}</h2>
                <p>${project.classification}</p>
              </a>
            </li>
          `;
      });

      // Insert cursor player + list items
      listContainer.innerHTML = cursorPlayerHTML + listItemsHTML;

      // Dispatch event for cursor player re-initialization (no video loading yet - deferred to after intro)
      setTimeout(() => {
        const event = new Event('slider-rendered');
        window.dispatchEvent(event);
      }, 100);

      if (DEBUG) console.log('Generated', projects.length, 'list items with .js-change-video');
    }

    function generateVideoElements(projects, loadNow) {
      const videoWrapper = document.querySelector('.box--home__wrapper');
      if (!videoWrapper) return;

      // Get existing placeholder videos
      const existingVideos = videoWrapper.querySelectorAll('video.js-main-video');

      // Set data-src on all videos immediately (no network cost)
      projects.forEach((project, index) => {
        if (existingVideos[index]) {
          const video = existingVideos[index];
          const videoUrl = project.video_thumbnail_url || project.video_url;
          video.setAttribute('data-src', videoUrl);
          video.src = videoUrl;
          if (index === 0) video.classList.add('visible', 'loaded');
        }
      });

      if (DEBUG) console.log(`✓ Assigned src to ${projects.length} videos`);

      // Only start loading if explicitly told to (after intro completes)
      if (loadNow) {
        _startVideoLoading(existingVideos, projects.length);
      }
    }

    function _startVideoLoading(existingVideos, count) {
      // Load first video and auto-play it
      if (existingVideos[0] && existingVideos[0].src) {
        existingVideos[0].load();
        existingVideos[0].addEventListener('canplay', function () {
          if (this.paused) {
            this.play().catch(() => { });
          }
        }, { once: true });
      }
      // Stagger-load cursor player videos too
      const cursorVideos = document.querySelectorAll('.player-animated-player[data-src]');
      cursorVideos.forEach((video, i) => {
        if (video.dataset.src && !video.getAttribute('data-loaded')) {
          video.setAttribute('data-loaded', '1');
          video.src = video.dataset.src;
          setTimeout(() => video.load(), i * 80);
        }
      });
      // Stagger-load remaining main videos
      for (let i = 1; i < (existingVideos.length) && i < count; i++) {
        const v = existingVideos[i];
        setTimeout(() => { if (v.src) v.load(); }, i * 150);
      }
    }

    function updateInitialState(projects) {
      // Update counter
      const counter = document.querySelector('.box--home__info__counter');
      if (counter) {
        counter.innerHTML = `<span>1</span>/<span id="slider-total">${projects.length}</span>`;
      }

      // Update initial links
      const firstProject = projects[0];
      if (!firstProject) return;

      const mainLink = document.querySelector('.box--home__link');
      if (mainLink) {
        mainLink.href = firstProject.link || `works/project-detail#id=${firstProject.id}`;
      }

      const mobileLink = document.querySelector('.mobile-link');
      if (mobileLink) {
        mobileLink.href = firstProject.link || `works/project-detail#id=${firstProject.id}`;
      }

      const cursorText = document.querySelector('.cursor-main-text');
      if (cursorText) {
        cursorText.textContent = `open ${firstProject.title}`;
      }

      if (DEBUG) console.log('Initial state updated');
    }

    function enableLinks(firstProject) {
      // Enable main link
      const mainLink = document.getElementById('homepage-main-link');
      if (mainLink) {
        mainLink.style.pointerEvents = 'auto';
        mainLink.style.opacity = '1';
        if (DEBUG) console.log('✓ Main link enabled');
      }

      // Enable mobile link
      const mobileLink = document.getElementById('homepage-mobile-link');
      if (mobileLink) {
        mobileLink.style.pointerEvents = 'auto';
        mobileLink.style.opacity = '1';

      const fragments = projects.map(project => {

        return `
            <li class="box box--work" data-cat="${project.classification}">
              <a href="${project.link}" class="box--work__link js-has-cursor-text">
                <div class="box--work__info">
                  <p>${displayClient}</p>

                  <video class="js-video lazy-media" data-src="${project.video_url}" playsinline loop muted></video>
                </div>
                <div class="cursor-text-animated js-cursor-text-animated">
                  <div class="mooving-elements is-arrow" data-friction="1">
                    <svg width="11" height="10" viewBox="0 0 11 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M8.72366 3.91174H7.0685L5.14349 3.8482L6.53777 4.99985L8.40882 6.65189L7.19444 7.72412L5.3234 6.07209L4.01007 4.83306L4.07303 6.50892L4.06404 8.02593L2.3819 6.54069L2.39989 2.42649L7.04152 2.42649L8.72366 3.91174Z" fill="white"/>

      });
      worksContainer.innerHTML = fragments.join('');

      // Initialize LazyLoad + dispatch event (requestAnimationFrame keeps it off the critical path)
      requestAnimationFrame(() => {
        if (typeof LazyLoad !== 'undefined') {
          new LazyLoad({
            elements_selector: '.bloc-projects-listing .lazy-media',
            threshold: 300,
            callback_loaded: (el) => { el.classList.add('loaded'); }

            if (el.dataset.src) { el.src = el.dataset.src; el.classList.add('loaded'); }

        }

        const blocListing = document.querySelector('.bloc-projects-listing');
        if (blocListing) blocListing.classList.add('ready');

        setTimeout(() => window.dispatchEvent(new Event('projects-rendered')), 200);
      });
    }

    // Expose initialization function globally for SPA navigation
    window.loadIndexProjects = async function (fromNavigation = false) {
      try {
        const projects = window.__projectsPreloadPromise
          ? await window.__projectsPreloadPromise
          : await window.fetchProjects();

        if (projects.length > 0) {
          const sliderProjects = projects.slice(0, 6);
          window.__sliderProjects = sliderProjects;

          // No video.load() / play() calls yet — those steal GPU from GSAP.
          generateListItems(sliderProjects);

          updateInitialState(sliderProjects);

          if (fromNavigation) {
            // SPA navigation: no preloader, render everything immediately
            generateVideoElements(sliderProjects, true);
            generateProjectsListing(projects);
          } else {
            // ── Phase 2 (runs AFTER preloader finishes) ───────────────────
            // Defer heavy work until GSAP animation completes.
            const renderAfterIntro = () => {
              // Start loading videos now that GSAP is done
              const existingVideos = document.querySelectorAll('.box--home__wrapper video.js-main-video');
              _startVideoLoading(existingVideos, sliderProjects.length);
              // Render the full projects listing grid
              generateProjectsListing(window.__allProjects);

            if (window.__gsapTextAnimationComplete) {
              // Animation already done (e.g. came back via SPA but skipIntro not set)
              renderAfterIntro();
            } else {
              window.addEventListener('gsap-text-animation-complete', renderAfterIntro, { once: true });
              // Safety fallback: render after 4 seconds even if event never fires
              setTimeout(() => {
                if (!window.__allProjects) return; // already rendered
                if (!document.getElementById('works').children.length) renderAfterIntro();
              }, 4000);
            }
          }
        }
      } catch (err) {
        console.error('❌ API failed:', err);
      }
    };

    // Start fetching immediately so data is ready by the time animation ends
    (async function () {
      await window.loadIndexProjects(false);
    })();
  </script>

  <script>
    // Configuration: Select intro text animation (1-8)
    // 1 = Cinematic Bloom & Glow
    // 2 = Shockwave Burst
    // 3 = Impact Burst
    // 4 = Kinetic Velocity Stretch
    // 5 = Cinematic Wipe
    // 6 = Quantum Shift
    // 7 = Neon Scan Line
    // 8 = Random Chaos
    window.SELECTED_ANIMATION = 5;

    // Check sessionStorage for skipIntro flag (set by project detail close button)
    const skipIntroFlag = sessionStorage.getItem('skipIntroAnimation') === 'true';
    const skipIntroTimestamp = sessionStorage.getItem('skipIntroTimestamp');
    const isRecentFlag = skipIntroTimestamp && (Date.now() - parseInt(skipIntroTimestamp)) < 5000;

    // Clear the flag after checking (one-time use)
    if (skipIntroFlag) {
      sessionStorage.removeItem('skipIntroAnimation');
      sessionStorage.removeItem('skipIntroTimestamp');
    }

    const shouldSkipIntro = skipIntroFlag && isRecentFlag;

    if (shouldSkipIntro) {

      // Skip animation completely
      const introWrapper = document.querySelector('.intro-anim-wrapper');
      const blocIntro = document.querySelector('.bloc-intro');

      if (introWrapper && blocIntro) {
        blocIntro.classList.add('lottie-started');
        blocIntro.classList.add('lottie-ended');
        document.body.classList.add('intro-ended');
        if (document.scrollingElement) {
          document.scrollingElement.classList.add('intro-ended');
        }
        introWrapper.style.display = 'none';

        const headerLogo = document.querySelector('.header__logo');
        if (headerLogo) {
          headerLogo.style.opacity = '1';
          headerLogo.classList.add('loaded');
        }
      }
    } else {
      // Run full animation
      const letters = document.querySelectorAll('.letter');

      function animateLetters() {
        const animIndex = window.SELECTED_ANIMATION || 1;

        const tl = gsap.timeline({
          onComplete: () => {
            const event = new CustomEvent('gsap-text-animation-complete', {
              detail: { duration: tl.duration() }
            });
            window.dispatchEvent(event);
            window.__gsapTextAnimationComplete = true;
          }
        });

        switch (animIndex) {
          case 1: // Cinematic Bloom & Glow
            gsap.set(letters, {
              opacity: 0,
              filter: 'blur(30px) brightness(5)',
              scale: 1.3,
              transformOrigin: 'center center'
            });
            tl.to(letters, {
              opacity: 1,
              filter: 'blur(0px) brightness(1)',
              scale: 1,
              duration: 1.4,
              stagger: 0.05,
              ease: 'power3.out'
            }, 0);
            break;

          case 2: // Shockwave Burst
            {
              const center = Math.floor(letters.length / 2);
              gsap.set(letters, { opacity: 0, scale: 3, filter: 'blur(10px)' });

              // Center appears first
              tl.to(letters[center], {
                opacity: 1,
                scale: 1,
                filter: 'blur(0px)',
                duration: 0.3,
                ease: 'power3.out'
              }, 0);

              // Shockwave outward
              letters.forEach((letter, i) => {
                if (i !== center) {
                  const distance = Math.abs(i - center);
                  tl.to(letter, {
                    opacity: 1,
                    scale: 1,
                    filter: 'blur(0px)',
                    duration: 0.4,
                    ease: 'power2.out'
                  }, 0.1 + (distance * 0.06));
                }
              });
            }
            break;

          case 3: // Impact Burst
            {
              const center = Math.floor(letters.length / 2);
              gsap.set(letters, { opacity: 0, scale: 2 });

              tl.to(letters[center], {
                opacity: 1,
                scale: 1,
                duration: 0.2,
                ease: 'back.out(3)'
              }, 0);

              letters.forEach((letter, i) => {
                if (i !== center) {
                  const distance = Math.abs(i - center);
                  tl.to(letter, {
                    opacity: 1,
                    scale: 1,
                    duration: 0.3,
                    ease: 'back.out(2)'
                  }, 0.2 + (distance * 0.05));
                }
              });
            }
            break;

          case 4: // Kinetic Velocity Stretch
            gsap.set(letters, {
              opacity: 0,
              x: -250,
              scaleX: 2.5,
              skewX: -25
            });
            tl.to(letters, {
              opacity: 1,
              x: 0,
              scaleX: 1,
              skewX: 0,
              duration: 0.9,
              stagger: 0.03,
              ease: 'power4.out'
            }, 0);
            break;

          case 5: // Cinematic Wipe
            gsap.set(letters, {
              opacity: 0,
              scaleX: 0,
              transformOrigin: "left center",
              display: "inline-block"
            });

            tl.to(letters, {
              opacity: 1,
              scaleX: 1,
              duration: 0.8,
              stagger: 0.04,
              ease: "power2.out"
            }, 0);
            break;

          case 6: // Quantum Shift
            gsap.set(letters, { opacity: 0 });
            letters.forEach((letter, i) => {
              for (let j = 0; j < 3; j++) {
                const offset = j * 0.05;
                tl.fromTo(letter,
                  {
                    opacity: 0.3,
                    x: gsap.utils.random(-100, 100),
                    y: gsap.utils.random(-100, 100)
                  },
                  {
                    opacity: j === 2 ? 1 : 0,
                    x: 0,
                    y: 0,
                    duration: 0.3,
                    ease: 'power2.out'
                  },
                  (i * 0.04) + offset
                );
              }
            });
            break;

          case 7: // Neon Scan Line
            gsap.set(letters, {
              opacity: 0,
              filter: 'brightness(0)'
            });
            tl.to(letters, {
              opacity: 1,
              filter: 'brightness(2)',
              duration: 0.1,
              stagger: 0.05,
              ease: 'none'
            }, 0);
            tl.to(letters, {
              filter: 'brightness(1)',
              duration: 0.3,
              stagger: 0.05,
              ease: 'power2.out'
            }, 0.1);
            break;

          case 8: // Random Chaos
            letters.forEach((letter, i) => {
              gsap.set(letter, {
                opacity: 0,
                x: gsap.utils.random(-300, 300),
                y: gsap.utils.random(-200, 200),
                rotation: gsap.utils.random(-360, 360),
                scale: gsap.utils.random(0.2, 3)
              });

              const startTime = gsap.utils.random(0, 0.5);
              tl.to(letter, {
                opacity: 1,
                x: 0,
                y: 0,
                rotation: 0,
                scale: 1,
                duration: gsap.utils.random(0.8, 1.2),
                ease: 'power3.out'
              }, startTime);
            });
            break;

          default:
            // Fallback to Bloom & Glow
            gsap.set(letters, {
              opacity: 0,
              filter: 'blur(30px) brightness(5)',
              scale: 1.3,
              transformOrigin: 'center center'
            });
            tl.to(letters, {
              opacity: 1,
              filter: 'blur(0px) brightness(1)',
              scale: 1,
              duration: 1.4,
              stagger: 0.05,
              ease: 'power3.out'
            }, 0);
        }

        return tl;
      }

      // Start animation on page load
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => { animateLetters(); }, 500);
      });

      // Listen for animation completion → trigger upward movement to header
      window.addEventListener('gsap-text-animation-complete', () => {
        const blocIntro = document.querySelector('.bloc-intro');
        const introWrapper = document.querySelector('.intro-anim-wrapper');

        if (blocIntro && introWrapper) {
          blocIntro.classList.add('lottie-ended');

          // Wait for CSS upward movement to complete (800ms transition)
          setTimeout(() => {
            const headerLogo = document.querySelector('.header__logo');
            if (headerLogo) {
              headerLogo.style.opacity = '1';
              headerLogo.classList.add('loaded');
            }

            const preloaderText = document.querySelector('.intro-text-animation');
            if (preloaderText) {
              preloaderText.style.transition = 'opacity 0.3s ease';
              preloaderText.style.opacity = '0';
            }
          }, 800);

          // Add intro-ended class after full transition
          setTimeout(() => {
            document.body.classList.add('intro-ended');
            if (document.scrollingElement) {
              document.scrollingElement.classList.add('intro-ended');
            }
            setTimeout(() => { introWrapper.style.display = 'none'; }, 300);
          }, 1200);
        }
      });
    } // End of else block
  </script>

        const targetItem = listItems[targetIndex];
        console.log('targetItem:', targetItem, 'targetIndex:', targetIndex);
        if (targetItem) {
          targetItem.classList.add('is-active');
          console.log('Added is-active to:', targetItem, 'classList:', targetItem.classList);
        }

        // Update counter
        if (counter) counter.textContent = targetIndex + 1;

        // Update links
        const targetLink = targetItem?.querySelector('.js-change-video');
        if (targetLink) {
          const itemTitle = targetLink.querySelector('h2')?.textContent || '';
          const linkHref = targetLink.href;
          if (mainLink) {
            mainLink.href = linkHref;
            mainLink.setAttribute('onclick', `window.location.replace('${linkHref}'); return false;`);
            mainLink.setAttribute('data-cursor-text', `Open ${itemTitle}`);
          }
          if (mobileLink) {
            mobileLink.href = linkHref;
            mobileLink.setAttribute('onclick', `window.location.replace('${linkHref}'); return false;`);
          }
          if (cursorText) cursorText.textContent = `open ${itemTitle}`;
        }

        // Reset timeline
        if (timeline) timeline.style.width = '0';

        // Switch videos
        mainVideos.forEach((v, vIndex) => {
          if (vIndex === targetIndex) {
            v.currentTime = 0;
            v.classList.add('visible', 'loaded');
            v.play().catch(err => console.log('Play prevented:', err));
          } else {
            v.classList.remove('visible');
            v.pause();
          }
        });

        // Add timeline animation class
        if (timeline) timeline.classList.add('is-animated');

        // Update cursor player data-player-active
        sliderContainer.setAttribute('data-player-active', targetIndex);

        console.log(`✓ Switched to video ${targetIndex + 1}`);
      }

      // onPrevClick - handle all prev arrows (mobile + desktop)
      mobileArrowPrev.forEach(arrow => {
        arrow.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          console.log('← Prev arrow clicked');
          currentlyPlaying--;
          if (currentlyPlaying < minPlaying) currentlyPlaying = maxPlaying;
          console.log(`currentlyPlaying: ${currentlyPlaying}`);
          switchToVideo(currentlyPlaying);
        });
      });

      // onNextClick - handle all next arrows (mobile + desktop)
      mobileArrowNext.forEach(arrow => {
        arrow.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          console.log('→ Next arrow clicked');
          currentlyPlaying++;
          if (currentlyPlaying > maxPlaying) currentlyPlaying = minPlaying;
          console.log(`currentlyPlaying: ${currentlyPlaying}`);
          switchToVideo(currentlyPlaying);
        });
      });

      console.log('✓ Video switching, timeline, and arrows re-initialized');
    }); // Removed { once: true } so this runs every time homepage is loaded

    // Category filtering - replicate build.min.js logic
    window.addEventListener('projects-rendered', function () {
      console.log('🔄 Initializing category filtering...');

      const filterLinks = document.querySelectorAll('.js-filter-cat');
      const worksList = document.querySelector('.list--works');
      const header = document.querySelector('header.header');

      const allWorks = worksList.querySelectorAll('.box--work');

      console.log({ allWorks });
      if (!filterLinks.length || !worksList) {
        console.warn('Filter links or works list not found');
        return;
      }

      // Store current filter state
      let currentFilter = '*';

      // Add click handlers to filter links
      filterLinks.forEach(link => {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();

          const selectedCategory = this.getAttribute('data-cat');
          console.log(`Filter clicked: ${selectedCategory}`);

          // Update active state on filter links
          filterLinks.forEach(l => l.classList.remove('is-active'));
          this.classList.add('is-active');

          // Store current filter
          currentFilter = selectedCategory;

          // Get all work items
          const allWorks = worksList.querySelectorAll('.box--work');
          console.log(`Filtering ${allWorks.length} projects by category: ${selectedCategory}`);


          console.log({ allWorks });
          // Filter logic: show items matching filter or if filter is "*" (all)
          allWorks.forEach(work => {
            const workCategory = work.getAttribute('data-cat');


            // Case-insensitive comparison
            const matches = selectedCategory === '*' ||
              (workCategory && workCategory.toLowerCase() === selectedCategory.toLowerCase());

            if (matches) {
              work.classList.remove('hidden');
              console.log(`✓ Showing: ${work.querySelector('h2')?.textContent || 'Unknown'} (${workCategory})`);
            } else {
              work.classList.add('hidden');
              console.log(`✗ Hiding: ${work.querySelector('h2')?.textContent || 'Unknown'} (${workCategory})`);
            }
          });

          // Force header to stay in "on-works-section" state when filtering is active
          // This ensures projects-nav remains visible even with fewer projects
          if (header) {
            if (selectedCategory === '*') {
              // "All" filter - let normal scroll behavior control visibility
              header.classList.remove('filter-active');
              console.log('✓ Removed filter-active class - normal scroll behavior');
            } else {
              // Specific filter active - force projects-nav to stay visible
              header.classList.add('on-works-section', 'filter-active');
              console.log('✓ Added filter-active class - projects-nav forced visible');
            }
          }

          console.log(`✓ Filtering complete - showing projects with category: ${selectedCategory}`);
        });
      });

      console.log('✓ Category filtering initialized');

      // Override scroll behavior to maintain projects-nav visibility during filtering
      let originalScrollHandler = null;

      // Store reference to prevent scroll from hiding projects-nav when filter is active
      function preventScrollHide() {
        const header = document.querySelector('header.header');
        if (header && header.classList.contains('filter-active')) {
          // Force on-works-section to stay active during filtering
          if (!header.classList.contains('on-works-section')) {
            header.classList.add('on-works-section');
            console.log('✓ Maintained on-works-section during filtering');
          }
        }
      }

      // Add scroll listener to maintain filter visibility
      window.addEventListener('scroll', preventScrollHide);

      console.log('✓ Scroll override for filtering initialized');
    });

  </script>
